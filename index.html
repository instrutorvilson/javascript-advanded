<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>   
    <div class="container">
        <h1 class="text-center">Agenda</h1>
        <label for="id">Informe nome</label>
        <input type="text" id="nome" placeholder="EX: ana" class="form-control" />

        <label for="id">Informe email</label>
        <input type="email" id="email" placeholder="EX: ana@gmail.com" class="form-control" />

        <label for="id">Informe telefone</label>
        <input type="tel" id="fone" placeholder="EX: (47)9090-0909" class="form-control" />

        <button class="mt-3 btn btn-primary" onclick="salvar()">Salvar</button>
        <div id="message">

        </div>

        <hr />
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>Fone</th>
                </tr>
            </thead>
            <tbody>
                <!--carregar dados com javascript-->
            </tbody>
        </table>
    </div>
    

    <script>
        document.addEventListener('DOMContentLoaded', ()=> {
            var linhas = ''
             const baseUrl = 'http://localhost:3000/contatos'
             fetch(baseUrl)
             .then(data => data.json())
             .then(resp => {
                for(let i = 0; i < resp.length; i++){
                   linhas += `<tr><td>${resp[i].nome}</td><td>${resp[i].email}</td><td>${resp[i].fone}</td></tr>`
                }
                document.getElementsByTagName('tbody')[0].innerHTML = linhas
             })           
            
        })

        function salvar(){
            const baseUrl = 'http://localhost:3000/contatos'
            const inputNome = document.getElementById('nome')

            if(inputNome.value == ''){
                document.getElementById('message').innerHTML = 'O nome deve ser informado'
                inputNome.focus()
                return
            }

            const inputEmail = document.getElementById('email')
            const inputFone = document.getElementById('fone')



            const contato = {
                nome: inputNome.value,
                email: inputEmail.value,
                fone: inputFone.value
            }

            fetch(baseUrl,{ 
                method: 'POST', 
                body: JSON.stringify(contato), 
                headers:{ 'content-type':'application/JSON'}
            })
            
        }
    </script>
</body>
</html>
